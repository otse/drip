<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Matrix Rain — foreignObject + Pixelated</title>
  <link rel="stylesheet" href="dev-column.css">
  <style>
    html,
    body {
      margin: 0;
      height: 100%;
      background: #242424;
      overflow: hidden;
    }

    #output {
      display: block;
      image-rendering: pixelated;
      transform: perspective(1024px) scale(2) rotateX(10deg) rotateY(-30deg);
      filter: contrast(1.15) saturate(5) saturate(0.5) brightness(2);
      background: #000;
      box-shadow: inset 0 0 24px rgba(0, 255, 128, 0.15);
      /* filter: url(#bloomm) url(#fisheye) url(#inner-gloww); */
    }
  </style>
</head>

<body>
  <canvas id="output"></canvas>
  <div id="devColumn" class="dev-column"></div>

  <script>
    let W = window.innerWidth;
    let H = window.innerHeight;

    const PIXEL_SIZE = 2; // block size of the final pixelation
    const FALL_SPEED_SCALE = 0.5; // base multiplier; each column gets its own speed spread around this
    const SPEED_VARIANCE = 2.0; // higher = bigger difference between slow and fast columns
    const STATIC_GLYPHS = false; // true = a trail's characters stay fixed as it falls, only rerolled on reset
    const GLYPH_REROLL_CHANCE = 0.15; // fraction of characters rerolled on each row step (ignored when STATIC_GLYPHS is true)
    const PORTAL_CHANCE = 0.5; // chance a trail becomes a "portal" trail
    const PORTAL_LOCK_OFFSET_MIN = 0.35; // begins around the middle of the visible screen
    const PORTAL_LOCK_OFFSET_MAX = 0.65; // ends around the middle of the visible screen
    const PORTAL_FADE_STEP = 0.08; // opacity lost per row-step once the head starts fading out

    const devColumnEl = document.getElementById("devColumn");
    let CHAR_W;
    let LINE_H;
    let columnCount;

    const MIN_LINE_HEIGHT = 4; // px floor so a tiny/zero live-edited font-size can't blow up glyph-count loops below

    function getLineHeight(el) {
      const lh = parseFloat(getComputedStyle(el).lineHeight) || parseFloat(getComputedStyle(el).fontSize) * 1.2;
      // guard against zero/NaN/too-small line-height, which would make the glyph-block loops below huge or infinite
      return lh >= MIN_LINE_HEIGHT ? lh : MIN_LINE_HEIGHT;
    }

    const chars = "アイウエオカキクケコサシスセソ0";
    const ROWS_PER_TRAIL = 20;

    function randomChar() {
      return chars[Math.floor(Math.random() * chars.length)];
    }

    function randomGlyphBlock(rows) {
      let text = "";
      for (let i = 0; i < rows; i++) text += randomChar() + "\n";
      return text;
    }

    // rerolls only the rows flagged as "dynamic", so rows flagged "static" keep the
    // same character for the whole lifetime of the trail instead of being re-randomized
    // (and possibly re-picking a static row) on every step
    function partialRerollGlyphBlock(glyphs, dynamicMask) {
      const rows = glyphs.split("\n");
      for (let i = 0; i < rows.length; i++) {
        if (rows[i] && dynamicMask[i]) rows[i] = randomChar();
      }
      return rows.join("\n");
    }

    function randomMask(rows, dynamicChance) {
      const mask = new Array(rows);
      for (let i = 0; i < rows; i++) mask[i] = Math.random() < dynamicChance;
      return mask;
    }

    // while a column is "locked" into a portal, its head (last row) stays fixed in place;
    // the trailing rows above it keep rolling/rerolling downward, shifting toward the head by
    // one row each tick, and the row that reaches the head is consumed and disappears. The total
    // row count never changes (a blank row backfills the top instead of a fresh glyph), so the
    // head's index - and therefore its rendered pixel position - stays fixed the whole time.
    function shiftPortalRows(glyphs) {
      const rows = glyphs.split("\n");
      let lastRow = rows.length - 1;
      while (lastRow > 0 && !rows[lastRow]) lastRow--;
      const head = rows[lastRow];
      const trailing = rows.slice(0, lastRow);
      trailing.pop(); // row closest to the head is absorbed into the portal and disappears for good
      if (!STATIC_GLYPHS) {
        for (let i = 0; i < trailing.length; i++) {
          if (trailing[i] && Math.random() < GLYPH_REROLL_CHANCE) trailing[i] = randomChar(); // never conjure a glyph into an already-blank slot
        }
      }
      trailing.unshift(""); // nothing new enters - a blank row grows in from the top instead
      return [...trailing, head].join("\n");
    }

    // one falling glyph stream; advances a full text row at a time instead of a pixel crawl,
    // with its own randomized cadence so columns don't all step in lockstep
    class Column {
      constructor(height) {
        this.reset(height);
      }
      reset(height) {
        this.y = Math.floor(Math.random() * -height);
        this.frame = 0;
        const slowFactor = 0.5 + Math.random() * SPEED_VARIANCE;
        this.interval = (2 + Math.floor(Math.random() * 5)) * FALL_SPEED_SCALE * slowFactor; // slow and fast columns drift apart here
        this.glyphs = randomGlyphBlock(ROWS_PER_TRAIL);
        this.dynamicMask = randomMask(ROWS_PER_TRAIL, GLYPH_REROLL_CHANCE); // which rows keep rerolling vs. staying fixed for this trail's lifetime
        this.isPortal = Math.random() < PORTAL_CHANCE; // this trail's head will freeze once it reaches portalLockY
        this.portalLocked = false;
        this.portalLockY = this.isPortal ? this.y + height * (PORTAL_LOCK_OFFSET_MIN + Math.random() * (PORTAL_LOCK_OFFSET_MAX - PORTAL_LOCK_OFFSET_MIN)) : 0;
        this.portalFading = false; // true once the trail is fully consumed and the head itself starts fading
        this.portalFade = 1; // head opacity; only drops below 1 while portalFading
      }
      step(height, lineHeight) {
        if (this.portalLocked) {
          if (++this.frame < this.interval) return;
          this.frame = 0;
          if (this.portalFading) {
            this.portalFade -= PORTAL_FADE_STEP;
            if (this.portalFade <= 0) this.reset(height);
            return;
          }
          this.glyphs = shiftPortalRows(this.glyphs);
          if (this.glyphs.split("\n").filter(Boolean).length <= 1) this.portalFading = true; // whole trail has fallen into the head - fade it out instead of vanishing instantly
          return;
        }
        if (++this.frame < this.interval) return;
        this.frame = 0;
        this.y += lineHeight;
        if (!STATIC_GLYPHS) this.glyphs = partialRerollGlyphBlock(this.glyphs, this.dynamicMask);
        if (this.isPortal && this.y >= this.portalLockY) this.portalLocked = true; // head position is now frozen at this.y
        if (this.y > height) this.reset(height);
      }
    }

    const columns = [];

    function updateColumnLayout() {
      CHAR_W = parseFloat(getComputedStyle(devColumnEl).width);
      // guard against zero/negative/NaN widths (e.g. live-edited dev-column CSS)
      // which would make columnCount infinite and freeze the page in the while loop below
      if (!(CHAR_W > 0)) CHAR_W = 1;
      LINE_H = getLineHeight(devColumnEl);
      columnCount = Math.ceil(W / CHAR_W);
      while (columns.length < columnCount) columns.push(new Column(H));
      columns.length = columnCount;
    }
    updateColumnLayout();

    // fills a single standalone column with enough glyphs to span top to bottom
    function fillDevColumn() {
      const count = Math.ceil(window.innerHeight / getLineHeight(devColumnEl)) + 2;
      let text = "";
      for (let i = 0; i < count; i++) text += randomChar() + "\n";
      devColumnEl.textContent = text;
    }
    fillDevColumn();
    window.addEventListener("resize", () => {
      fillDevColumn();
      W = window.innerWidth;
      H = window.innerHeight;
      off.width = Math.ceil(W / PIXEL_SIZE);
      off.height = Math.ceil(H / PIXEL_SIZE);
      out.width = W;
      out.height = H;
      outCtx.imageSmoothingEnabled = false; // resizing a canvas resets its context state
    });

    // styles must be inlined: foreignObject content is rendered in an isolated document
    // with no access to the host page's <style> rules, so pull the live values from
    // dev-column.css (via #devColumn's computed style) instead of hardcoding them.
    // Properties are read straight off the .dev-column stylesheet rule, so anything
    // added/removed there is picked up automatically - no key list to maintain.
    // Layout props are excluded since each rain column positions itself.
    const GLYPH_STYLE_EXCLUDE = new Set(["position", "top", "left", "width", "height", "z-index"]);

    function findDevColumnRule() {
      for (const sheet of document.styleSheets) {
        let rules;
        try {
          rules = sheet.cssRules;
        } catch {
          continue; // cross-origin stylesheet, can't inspect its rules
        }
        for (const rule of rules) {
          if (rule.selectorText === ".dev-column") return rule;
        }
      }
      return null;
    }

    const devColumnRule = findDevColumnRule();

    // recomputing the style string is pointless unless the rule's CSS actually changed,
    // so skip the getComputedStyle/filter/map/join work when cssText matches last frame
    let cachedColumnStyle = "";

    function readColumnStyle() {
      const cs = getComputedStyle(devColumnEl);
      const props = devColumnRule ? Array.from(devColumnRule.style) : [];
      // cache key is the actual computed values we're about to render, not the
      // stylesheet rule's own cssText - the rule's cssText only changes when that
      // specific rule is edited, but getComputedStyle can change for other reasons
      // (e.g. an inline style / DevTools "Computed" panel edit on the element itself),
      // which would otherwise leave this serving a stale (and silently out-of-sync) style
      const style = props
        .filter((prop) => !GLYPH_STYLE_EXCLUDE.has(prop))
        .map((prop) => `${prop}:${cs.getPropertyValue(prop)};`)
        .join(" ");
      cachedColumnStyle = style;
      return cachedColumnStyle;
    }

    // the lowest (last) row of a trail is its leading edge - highlight it per-character
    // with an explicit color instead of a CSS gradient/background-clip fade
    // ordered from the lowest/leading row upward; rows beyond this length darken further via darkenGreen()
    const TAIL_COLORS = ["#ffffff", "#ccffcc", "#99ff99", "#66ff66", "#33ff33"];
    const DARKEN_STEP = 80; // green channel reduction per row above the tail colors
    const MIN_GREEN = 0x30; // floor so higher (older) characters stay faintly visible

    // rows above the tail-color range (i.e. further from the leading edge) get
    // progressively darker green, computed per-character rather than via a CSS gradient
    function darkenGreen(rowsAboveTail) {
      const green = Math.max(MIN_GREEN, 0xff - rowsAboveTail * DARKEN_STEP);
      return `#00${green.toString(16).padStart(2, "0")}00`;
    }

    function glyphBlockToHTML(glyphs, headFade = 1) {
      const rows = glyphs.split("\n");
      let lastRow = rows.length - 1;
      while (lastRow > 0 && !rows[lastRow]) lastRow--; // skip trailing empty row from the final "\n"
      let html = "";
      for (let i = 0; i <= lastRow; i++) {
        if (!rows[i]) {
          html += "\n"; // blank row (e.g. consumed by a portal) - keep its line height, draw nothing
          continue;
        }
        const colorIndex = lastRow - i;
        const color = colorIndex < TAIL_COLORS.length ? TAIL_COLORS[colorIndex] : darkenGreen(colorIndex - TAIL_COLORS.length);
        const opacityStyle = i === lastRow && headFade < 1 ? ` opacity:${headFade};` : ""; // fades the head out once its portal trail is fully consumed
        html += `<span style="color:${color};${opacityStyle}">${rows[i]}</span>\n`;
      }
      return html;
    }

    function buildRainHTML() {
      const glyphStyle = escapeAttr(readColumnStyle());
      let cols = "";
      for (let i = 0; i < columnCount; i++) {
        const column = columns[i];
        cols += `<div style="position:absolute; top:${column.y}px; left:${i * CHAR_W}px; width:${CHAR_W}px; ${glyphStyle}">${glyphBlockToHTML(column.glyphs, column.portalFade)}</div>`;
      }
      return `<div xmlns="http://www.w3.org/1999/xhtml" style="width:100%; height:100%;">${cols}</div>`;
    }

    function stepColumns() {
      for (const column of columns) column.step(H, LINE_H);
    }

    // CSS values (e.g. a quoted font-family stack) can contain " which would break
    // the style="..." attribute in the generated SVG/XML, so escape before inlining
    function escapeAttr(str) {
      return str.replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    // one Image/handlers reused for every frame instead of allocating a fresh
    // Image + Blob + object URL + promise per frame, which is what was piling up
    // garbage fast enough to slow the page down over time. The previous frame's
    // object URL is revoked as soon as the new one is created, so at most one
    // blob is ever alive.
    const rainImg = new Image();
    let rainImgUrl = null;

    function domToImage(html, w, h) {
      const svg = `
    <svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}">
      <foreignObject width="100%" height="100%">
        ${html}
      </foreignObject>
    </svg>`;
      const blob = new Blob([svg], { type: "image/svg+xml;charset=utf-8" });
      const previousUrl = rainImgUrl;
      rainImgUrl = URL.createObjectURL(blob);
      return new Promise((resolve, reject) => {
        const releasePreviousUrl = () => {
          if (previousUrl) URL.revokeObjectURL(previousUrl);
        };
        rainImg.onload = () => {
          releasePreviousUrl();
          resolve(rainImg);
        };
        rainImg.onerror = () => {
          releasePreviousUrl();
          reject(new Error("Malformed SVG frame"));
        };
        rainImg.src = rainImgUrl;
      });
    }

    const off = document.createElement("canvas");
    off.width = Math.ceil(W / PIXEL_SIZE);
    off.height = Math.ceil(H / PIXEL_SIZE);
    const offCtx = off.getContext("2d");

    const out = document.getElementById("output");
    out.width = W;
    out.height = H;
    const outCtx = out.getContext("2d");
    outCtx.imageSmoothingEnabled = false;

    function applyCRT(outCtx, w, h) {
      const scanlineAlpha = 0.1;
      outCtx.save();
      outCtx.globalCompositeOperation = "source-atop";
      for (let y = 0; y < h; y += 4) {
        outCtx.fillStyle = `rgba(255,255,255,${scanlineAlpha})`;
        outCtx.fillRect(0, y, w, 1);
      }
      outCtx.restore();

      const vignette = outCtx.createRadialGradient(
        w / 2,
        h / 2,
        Math.min(w, h) * 0.2,
        w / 2,
        h / 2,
        Math.max(w, h) * 0.8
      );
      vignette.addColorStop(0, "rgba(0,0,0,0)");
      vignette.addColorStop(1, "rgba(0,0,0,0.1)");
      outCtx.fillStyle = vignette;
      outCtx.fillRect(0, 0, w, h);
    }

    async function renderFrame() {
      updateColumnLayout();
      stepColumns();
      const html = buildRainHTML();
      try {
        const img = await domToImage(html, W, H);
        offCtx.clearRect(0, 0, off.width, off.height);
        offCtx.drawImage(img, 0, 0, off.width, off.height);

        outCtx.clearRect(0, 0, W, H);
        outCtx.drawImage(off, 0, 0, off.width, off.height, 0, 0, W, H);

        // paint behind whatever the rain drew, so transparent/glyph-free areas show this color
        outCtx.globalCompositeOperation = "destination-over";
        outCtx.fillStyle = "#000";
        outCtx.fillRect(0, 0, W, H);
        outCtx.globalCompositeOperation = "source-over";

        applyCRT(outCtx, W, H);
      } catch (err) {
        console.warn("Skipping malformed frame", err); // e.g. mid-edit CSS value
      }

      requestAnimationFrame(renderFrame);
    }

    renderFrame();
  </script>

</body>

</html>
